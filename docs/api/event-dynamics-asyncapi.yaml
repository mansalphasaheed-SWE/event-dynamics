asyncapi: 3.0.0
id: urn:event-dynamics:realtime:v0.2.0
info:
  title: Event Dynamics Realtime API
  version: 0.2.0
  description: |-
    Server-side perspective: all operations send server-to-client SSE messages. Commands use REST. This contract shares the Event Dynamics REST authorization and entitlement rules; it never grants authority by message receipt.

    Use a fetch-based streaming client with Authorization: Bearer and Accept: text/event-stream. Native browser EventSource does not accept arbitrary Authorization headers. Never place credentials in query strings. Parse UTF-8 SSE framing across arbitrary transport chunks, including multiline data. SSE event is payload.type; id is the opaque delivery cursor for durable change notices. Control/liveness messages have no id and never advance the resume cursor. Comment heartbeats every 20 seconds keep the connection alive.

    On connection and reconnection refresh current access and REST state before re-enabling actions. Open/buffer the stream before refreshing state, then process buffered notices by fetching current authorized REST projections. Messages are invalidations, not authoritative partial patches. Deduplicate durable notices by messageId, coalesce repeated reads, and never replace a newer REST revision with an older one. Deletes and hidden records require list refresh. This closes the snapshot/subscription race without claiming historical collection snapshots.

    Retain durable replay history for at least 15 minutes. The client sends Last-Event-ID manually on reconnection. Cursors bind channel, scope, authorization generation and log generation; history is replayed only under current access. Missing cursor starts fresh with stream.ready and mandatory REST refresh. Expired, invalid, foreign or unavailable cursors cause stream.resync_required followed by close; discard cursor and refresh. No silent resume after a gap. Delivery is at least once. Replay support is application behavior, not supplied by SSE framing alone.

    Per-connection buffer limit is 1000 messages or 1 MiB, whichever first; overflow sends resync_required if possible and closes. These are explicit engineering defaults to load-test. Reconnect with exponential backoff and jitter between 1 and 30 seconds, honoring Retry-After; stop on 401/403 until reauthentication. Recheck authorization per message and on revocation, including stream termination within five seconds. Close immediately even when access.revoked cannot be delivered. Recheck parent order/ticket grant and field permissions continuously. Never replay private fields made inaccessible by scope changes.

    No QR material, secret credentials, payment details, attendee needs or raw AI prompts in stream payloads. AI output is read through the authorized job resource; liveness at most every ten seconds reports true stage without inventing output. REST remains available as recovery with bounded backoff. NFR freshness targets include enqueue, delivery, client processing and rendering; they are not measured by HTTP handshake latency.
  contact:
    name: Event Dynamics Engineering
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: api.eventdynamics.example
    pathname: /v1/streams
    protocol: https
    description: Placeholder deployment hostname. Authenticated SSE; exact HTTP handshakes in the REST document.
channels:
  runOfShow:
    address: /organizations/{organizationId}/events/{eventId}/run-of-show
    title: Run-of-show and public programme updates
    description: Currently authorized scope only. Inherit the corresponding REST record and field visibility.
      External event membership is sufficient for its event channels; organization workspace stream requires
      organization authority.
    servers:
    - $ref: '#/servers/production'
    messages:
      RunOfShowChanged:
        $ref: '#/components/messages/RunOfShowChanged'
      StreamReady:
        $ref: '#/components/messages/StreamReady'
      ResyncRequired:
        $ref: '#/components/messages/ResyncRequired'
      AccessRevoked:
        $ref: '#/components/messages/AccessRevoked'
    parameters:
      organizationId:
        description: Authorized organizationId; UUID identifier.
      eventId:
        description: Authorized eventId; UUID identifier.
    x-rest-operationIds:
    - listRunOfShowItems
    - getPublicProgramme
    - getReadiness
  admissions:
    address: /organizations/{organizationId}/events/{eventId}/admissions
    title: Live admission activity and attendance aggregates
    description: Currently authorized scope only. Inherit the corresponding REST record and field visibility.
      External event membership is sufficient for its event channels; organization workspace stream requires
      organization authority.
    servers:
    - $ref: '#/servers/production'
    messages:
      AdmissionsChanged:
        $ref: '#/components/messages/AdmissionsChanged'
      StreamReady:
        $ref: '#/components/messages/StreamReady'
      ResyncRequired:
        $ref: '#/components/messages/ResyncRequired'
      AccessRevoked:
        $ref: '#/components/messages/AccessRevoked'
    parameters:
      organizationId:
        description: Authorized organizationId; UUID identifier.
      eventId:
        description: Authorized eventId; UUID identifier.
    x-rest-operationIds:
    - listAdmissions
    - getAttendanceAggregate
    - listAdmissionConflicts
  announcements:
    address: /organizations/{organizationId}/events/{eventId}/announcements
    title: Operational announcements
    description: Currently authorized scope only. Inherit the corresponding REST record and field visibility.
      External event membership is sufficient for its event channels; organization workspace stream requires
      organization authority.
    servers:
    - $ref: '#/servers/production'
    messages:
      AnnouncementsChanged:
        $ref: '#/components/messages/AnnouncementsChanged'
      StreamReady:
        $ref: '#/components/messages/StreamReady'
      ResyncRequired:
        $ref: '#/components/messages/ResyncRequired'
      AccessRevoked:
        $ref: '#/components/messages/AccessRevoked'
    parameters:
      organizationId:
        description: Authorized organizationId; UUID identifier.
      eventId:
        description: Authorized eventId; UUID identifier.
    x-rest-operationIds:
    - listAnnouncements
  orderStatus:
    address: /public/orders/{orderId}/status
    title: Purchaser order and payment status
    description: Currently authorized scope only. Exact order view_order session; a ticket-only session cannot
      subscribe.
    servers:
    - $ref: '#/servers/production'
    messages:
      OrderStatusChanged:
        $ref: '#/components/messages/OrderStatusChanged'
      StreamReady:
        $ref: '#/components/messages/StreamReady'
      ResyncRequired:
        $ref: '#/components/messages/ResyncRequired'
      AccessRevoked:
        $ref: '#/components/messages/AccessRevoked'
    parameters:
      orderId:
        description: Authorized orderId; UUID identifier.
    x-rest-operationIds:
    - getOrder
    - getOrderTickets
  aiJobProgress:
    address: /organizations/{organizationId}/ai-jobs/{jobId}/progress
    title: AI job queue position, stage, and output
    description: Currently authorized scope only. Inherit the corresponding REST record and field visibility.
      External event membership is sufficient for its event channels; organization workspace stream requires
      organization authority.
    servers:
    - $ref: '#/servers/production'
    messages:
      AiJobProgressChanged:
        $ref: '#/components/messages/AiJobProgressChanged'
      StreamReady:
        $ref: '#/components/messages/StreamReady'
      ResyncRequired:
        $ref: '#/components/messages/ResyncRequired'
      AccessRevoked:
        $ref: '#/components/messages/AccessRevoked'
      JobLiveness:
        $ref: '#/components/messages/JobLiveness'
    parameters:
      organizationId:
        description: Authorized organizationId; UUID identifier.
      jobId:
        description: Authorized jobId; UUID identifier.
    x-rest-operationIds:
    - getAiJob
  workspace:
    address: /organizations/{organizationId}/workspace
    title: Workspace-wide access, quota, and system notices
    description: Currently authorized scope only. Inherit the corresponding REST record and field visibility.
      External event membership is sufficient for its event channels; organization workspace stream requires
      organization authority.
    servers:
    - $ref: '#/servers/production'
    messages:
      WorkspaceChanged:
        $ref: '#/components/messages/WorkspaceChanged'
