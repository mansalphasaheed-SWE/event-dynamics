    - $ref: '#/channels/workspace/messages/ResyncRequired'
    - $ref: '#/channels/workspace/messages/AccessRevoked'
components:
  securitySchemes:
    teamSession:
      type: http
      scheme: bearer
      description: |
        Team/organizer session credential. Expires after 12 hours without
        activity and 7 days absolutely (NFR-SEC-08). Sensitive operations
        additionally require password reauthentication within the preceding
        10 minutes.
    secureLink:
      type: http
      scheme: bearer
      description: Opaque 256-bit purchaser/attendee session bearer. Scope and capabilities bind one order
        or ticket. Expires at min(issue + 24h, parent grant expiry); parent revocation invalidates sessions.
        Email grants last 30 days. Use POST /public/access-sessions for exchange.
  schemas:
    StreamReady:
      type: object
      properties:
        type:
          type: string
          const: stream.ready
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        authorizationRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        refreshRequired:
          type: boolean
          const: true
      additionalProperties: false
      required:
      - type
      - emittedAt
      - authorizationRevision
      - refreshRequired
    ResyncRequired:
      type: object
      properties:
        type:
          type: string
          const: stream.resync_required
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        reason:
          type: string
          enum:
          - cursor_expired
          - cursor_invalid
          - scope_changed
          - history_unavailable
          - buffer_overflow
          - server_restart
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - emittedAt
      - reason
    AccessRevoked:
      type: object
      properties:
        type:
          type: string
          const: access.revoked
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        reason:
          type: string
          enum:
          - revoked
          - expired
          - suspended
          - scope_changed
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - emittedAt
      - reason
    JobLiveness:
      type: object
      properties:
        type:
          type: string
          const: job.liveness
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        jobId:
          type: string
          format: uuid
          maxLength: 10000
        stage:
          type: string
          minLength: 0
          maxLength: 200
        lastProgressAt:
          type: string
          format: date-time
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - emittedAt
      - jobId
      - stage
      - lastProgressAt
    RunOfShowChanged:
      type: object
      properties:
        type:
          type: string
          const: runOfShow.changed
          maxLength: 10000
        messageId:
          type: string
          format: uuid
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        resourceKind:
          type: string
          enum:
          - run_of_show
          - session
          - readiness
          - programme_publication
          maxLength: 10000
        resourceId:
          type: string
          format: uuid
          maxLength: 10000
        resourceRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        change:
          type: string
          enum:
          - created
          - updated
          - deleted
          - scope_invalidated
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - messageId
      - emittedAt
      - resourceKind
      - resourceId
      - resourceRevision
      - change
      description: Committed change notice. Fetch current permitted REST view; scope invalidation requires
        collection refresh. resourceId is the relevant aggregate ID for aggregate/quota notices. Do not interpret
        a message as permission.
    AdmissionsChanged:
      type: object
      properties:
        type:
          type: string
          const: admissions.changed
          maxLength: 10000
        messageId:
          type: string
          format: uuid
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        resourceKind:
          type: string
          enum:
          - admission
          - attendance_aggregate
          - admission_conflict
          - offline_sync
          maxLength: 10000
        resourceId:
          type: string
          format: uuid
          maxLength: 10000
        resourceRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        change:
          type: string
          enum:
          - created
          - updated
          - deleted
          - scope_invalidated
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - messageId
      - emittedAt
      - resourceKind
      - resourceId
      - resourceRevision
      - change
      description: Committed change notice. Fetch current permitted REST view; scope invalidation requires
        collection refresh. resourceId is the relevant aggregate ID for aggregate/quota notices. Do not interpret
        a message as permission.
    AnnouncementsChanged:
      type: object
      properties:
        type:
          type: string
          const: announcements.changed
          maxLength: 10000
        messageId:
          type: string
          format: uuid
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        resourceKind:
          type: string
          enum:
          - announcement
          maxLength: 10000
        resourceId:
          type: string
          format: uuid
          maxLength: 10000
        resourceRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        change:
          type: string
          enum:
          - created
          - updated
          - deleted
          - scope_invalidated
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - messageId
      - emittedAt
      - resourceKind
      - resourceId
      - resourceRevision
      - change
      description: Committed change notice. Fetch current permitted REST view; scope invalidation requires
        collection refresh. resourceId is the relevant aggregate ID for aggregate/quota notices. Do not interpret
        a message as permission.
    OrderStatusChanged:
      type: object
      properties:
        type:
          type: string
          const: orderStatus.changed
          maxLength: 10000
        messageId:
          type: string
          format: uuid
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        resourceKind:
          type: string
          enum:
          - order
          - ticket
          - payment_attempt
          maxLength: 10000
        resourceId:
          type: string
          format: uuid
          maxLength: 10000
        resourceRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        change:
          type: string
          enum:
          - created
          - updated
          - deleted
          - scope_invalidated
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - messageId
      - emittedAt
      - resourceKind
      - resourceId
      - resourceRevision
      - change
      description: Committed change notice. Fetch current permitted REST view; scope invalidation requires
        collection refresh. resourceId is the relevant aggregate ID for aggregate/quota notices. Do not interpret
        a message as permission.
    AiJobProgressChanged:
      type: object
      properties:
        type:
          type: string
          const: aiJobProgress.changed
          maxLength: 10000
        messageId:
          type: string
          format: uuid
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        resourceKind:
          type: string
          enum:
          - ai_job
          - planning_section
          - action_proposal
          maxLength: 10000
        resourceId:
          type: string
          format: uuid
          maxLength: 10000
        resourceRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        change:
          type: string
          enum:
          - created
          - updated
          - deleted
          - scope_invalidated
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - messageId
      - emittedAt
      - resourceKind
      - resourceId
      - resourceRevision
      - change
      description: Committed change notice. Fetch current permitted REST view; scope invalidation requires
        collection refresh. resourceId is the relevant aggregate ID for aggregate/quota notices. Do not interpret
        a message as permission.
    WorkspaceChanged:
      type: object
      properties:
        type:
          type: string
          const: workspace.changed
          maxLength: 10000
        messageId:
          type: string
          format: uuid
          maxLength: 10000
        emittedAt:
          type: string
          format: date-time
          maxLength: 10000
        resourceKind:
          type: string
          enum:
          - effective_access
          - notification
          - import_job
          - export_job
          - quota
          - dependency
          maxLength: 10000
        resourceId:
          type: string
          format: uuid
          maxLength: 10000
        resourceRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        change:
          type: string
          enum:
          - created
          - updated
          - deleted
          - scope_invalidated
          maxLength: 10000
      additionalProperties: false
      required:
      - type
      - messageId
      - emittedAt
      - resourceKind
      - resourceId
      - resourceRevision
      - change
      description: Committed change notice. Fetch current permitted REST view; scope invalidation requires
        collection refresh. resourceId is the relevant aggregate ID for aggregate/quota notices. Do not interpret
        a message as permission.
  messages:
    StreamReady:
      name: StreamReady
      title: StreamReady
      summary: Non-durable stream control; no SSE id.
      payload:
        $ref: '#/components/schemas/StreamReady'
    ResyncRequired:
      name: ResyncRequired
      title: ResyncRequired
      summary: Non-durable stream control; no SSE id.
      payload:
        $ref: '#/components/schemas/ResyncRequired'
    AccessRevoked:
      name: AccessRevoked
      title: AccessRevoked
      summary: Non-durable stream control; no SSE id.
      payload:
        $ref: '#/components/schemas/AccessRevoked'
    JobLiveness:
      name: JobLiveness
      title: JobLiveness
      summary: Non-durable stream control; no SSE id.
      payload:
        $ref: '#/components/schemas/JobLiveness'
    RunOfShowChanged:
      name: RunOfShowChanged
      title: RunOfShowChanged
      summary: Durable replayable notice; SSE id is the delivery cursor.
      payload:
        $ref: '#/components/schemas/RunOfShowChanged'
    AdmissionsChanged:
      name: AdmissionsChanged
      title: AdmissionsChanged
      summary: Durable replayable notice; SSE id is the delivery cursor.
      payload:
        $ref: '#/components/schemas/AdmissionsChanged'
    AnnouncementsChanged:
      name: AnnouncementsChanged
      title: AnnouncementsChanged
      summary: Durable replayable notice; SSE id is the delivery cursor.
      payload:
        $ref: '#/components/schemas/AnnouncementsChanged'
    OrderStatusChanged:
      name: OrderStatusChanged
      title: OrderStatusChanged
      summary: Durable replayable notice; SSE id is the delivery cursor.
      payload:
        $ref: '#/components/schemas/OrderStatusChanged'
    AiJobProgressChanged:
      name: AiJobProgressChanged
      title: AiJobProgressChanged
      summary: Durable replayable notice; SSE id is the delivery cursor.
      payload:
