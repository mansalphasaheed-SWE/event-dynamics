components:
  securitySchemes:
    teamSession:
      type: http
      scheme: bearer
      description: |
        Team/organizer session credential. Expires after 12 hours without
        activity and 7 days absolutely (NFR-SEC-08). Sensitive operations
        additionally require password reauthentication within the preceding
        10 minutes.
    secureLink:
      type: http
      scheme: bearer
      description: Opaque 256-bit purchaser/attendee session bearer. Scope and capabilities bind one order
        or ticket. Expires at min(issue + 24h, parent grant expiry); parent revocation invalidates sessions.
        Email grants last 30 days. Use POST /public/access-sessions for exchange.
    deviceRecovery:
      type: http
      scheme: bearer
      description: Separate device-bound upload-only recovery credential. It confers no admission, dataset-download,
        refresh or workspace access. Preserves recovery after admission lease expiry/revocation; suspected
        compromise uses audited operator recovery.
    checkoutSession:
      type: http
      scheme: bearer
      description: Opaque short-lived checkout bootstrap session; creates orders and scopes their creation
        retries. Not a team login or access to other orders.
