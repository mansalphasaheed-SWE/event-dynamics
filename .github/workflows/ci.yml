name: Event Dynamics CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify project
    runs-on: unbuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm and Node.js runtime
        uses: pnpm/setup@v2
        with:
          cache: true
          runtime: node@22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run Unit and application tests
        run: pnpm tests

      - name: Run End-to-end tests
        run: pnpm test:e2e

      - name: Build application
        run: pnpm build
